# Included in every location that sets its own add_header (nginx does not inherit add_header there).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Ignored over plain HTTP; takes effect once TLS is terminated in front of this container.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Vue injects inline styles; the Google Calendar panel embeds calendar.google.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://calendar.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

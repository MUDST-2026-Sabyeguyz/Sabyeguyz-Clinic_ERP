# TEMPLATE ONLY. Render image refs, Ingress class/host, and storage class for
# the selected target before applying with an explicit context and namespace.
# Local feasibility used clinic-phase1 / clinic-erp-phase1 / traefik / standard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinic-erp-config
data:
  POSTGRES_DB: clinic_erp
  SPRING_PROFILES_ACTIVE: database-v2
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic_erp
  APP_BOOTSTRAP_ENABLED: "false"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db,databaseV2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: clinic-erp-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: clinic-erp-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clinic-erp-postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clinic-erp-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinic-erp-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: clinic-erp-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: clinic-erp-runtime
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinic-erp-runtime
                  key: POSTGRES_PASSWORD
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            # Proposed starting point only; tune from Minikube measurements.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
        # storageClassName intentionally omitted; verify the selected class.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-erp-backend
spec:
  replicas: 1
  strategy:
    # Flyway runs in the application at startup. Keep one migration runner.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: clinic-erp-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinic-erp-backend
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres-headless -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: clinic-erp-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: clinic-erp-runtime
                  key: POSTGRES_USER
      containers:
        - name: backend
          image: REGISTRY/OWNER/clinic-erp-backend:REPLACE_WITH_TESTED_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: clinic-erp-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clinic-erp-runtime
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinic-erp-runtime
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clinic-erp-runtime
                  key: JWT_SECRET
          startupProbe:
            # Health subpaths require authentication in the current image.
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # Public aggregate includes datasource/database-v2 health.
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Proposed starting point only; tune from Minikube measurements.
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: clinic-erp-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-erp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clinic-erp-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinic-erp-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: REGISTRY/OWNER/clinic-erp-frontend:REPLACE_WITH_TESTED_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Proposed starting point only; tune from Minikube measurements.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: clinic-erp-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinic-erp
spec:
  # ingressClassName and host remain unset until the local controller is chosen.
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

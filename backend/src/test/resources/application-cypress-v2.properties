# Only loaded by the test-classpath launcher (mvn -Pcypress-v2); never part of the production jar.
# The v2 schema runs on a real PostgreSQL (DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD).
server.address=127.0.0.1
server.port=18080
spring.flyway.locations=classpath:db/migration,classpath:db/seed_v2
app.jwt.secret=cypress-only-isolated-backend-secret-32chars
logging.level.root=WARN
spring.main.banner-mode=off

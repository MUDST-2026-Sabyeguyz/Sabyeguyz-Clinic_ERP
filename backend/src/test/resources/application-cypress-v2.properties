# Only loaded by the test-classpath launcher (mvn -Pcypress-v2); never part of the production jar.
# The v2 schema runs on a real PostgreSQL (DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD).
server.address=127.0.0.1
server.port=${CLINIC_V2_TEST_PORT:18080}
spring.flyway.locations=classpath:db/migration,classpath:db/seed_v2
app.jwt.secret=cypress-only-isolated-backend-secret-32chars
logging.level.root=WARN
spring.main.banner-mode=off
# Two-way Google Calendar sync runs against the in-memory fake; the timers are slow so the specs call POST /api/calendar/sync themselves.
app.calendar.enabled=true
app.calendar.push-interval-ms=3600000
app.calendar.pull-interval-ms=3600000
app.calendar.default-duration-minutes=60

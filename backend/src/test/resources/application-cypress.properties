# Only loaded by the test-classpath launcher; never included in the production jar.
server.address=127.0.0.1
server.port=18080
spring.datasource.url=jdbc:h2:mem:clinic_cypress;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DEFAULT_LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.target=20
app.jwt.secret=cypress-only-isolated-backend-secret-32chars
logging.level.root=WARN
spring.main.banner-mode=off

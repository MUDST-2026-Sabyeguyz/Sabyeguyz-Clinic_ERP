management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${OBSERVABILITY_OTLP_URL}/v1/metrics
management.otlp.metrics.export.step=${OBSERVABILITY_METRICS_STEP:30s}
management.otlp.metrics.export.resource-attributes.service.name=${spring.application.name}

management.otlp.tracing.export.enabled=true
management.otlp.tracing.endpoint=${OBSERVABILITY_OTLP_URL}/v1/traces
management.tracing.sampling.probability=${OBSERVABILITY_TRACE_SAMPLE_RATE:0.1}

management.otlp.logging.export.enabled=true
management.otlp.logging.endpoint=${OBSERVABILITY_OTLP_URL}/v1/logs

management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.config=classpath:logback-observability.xml
spring.application.name=clinic-erp-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clinic_erp_v2}
spring.datasource.username=${DATABASE_USERNAME:clinic}
spring.datasource.password=${DATABASE_PASSWORD:clinic_local_only}
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=${JWT_SECRET:clinic-erp-local-secret-change-me-32chars}
app.bootstrap.manager-username=${CLINIC_BOOTSTRAP_MANAGER_USERNAME:}
app.bootstrap.manager-password=${CLINIC_BOOTSTRAP_MANAGER_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

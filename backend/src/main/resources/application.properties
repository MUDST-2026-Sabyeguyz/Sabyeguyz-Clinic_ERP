spring.application.name=sabyeguyz-clinic-erp

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clinic_erp}
spring.datasource.username=${DATABASE_USERNAME:clinic}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
app.jwt.secret=${JWT_SECRET:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}

# Opt-in profile for the schema confirmed by the database team.
#
# The current domain model still contains mappings for the legacy schema, so
# Hibernate validation is deliberately disabled in this profile. Flyway owns
# the schema and DatabaseV2HealthIndicator reports whether the expected v2
# tables are actually present.
spring.flyway.locations=classpath:db/migration_new
spring.jpa.hibernate.ddl-auto=none
app.database.schema-v2.enabled=true
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}


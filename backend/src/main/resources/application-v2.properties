# Profile of com.sabyeguyz.clinicv2.ClinicV2Application: the v2 schema from db/migration.
# Reference data (roles, permissions, payment methods, master data) is part of db/migration.
# Demo accounts and sample data live in db/seed_v2 and are only loaded when asked for, e.g.
#   APP_V2_FLYWAY_EXTRA_LOCATIONS=,classpath:db/seed_v2
spring.application.name=clinic-erp-v2
spring.flyway.locations=classpath:db/migration${app.v2.flyway-extra-locations:}
# V4 (app_user.email) was published after some databases reached V1001.
# Apply that specific pending migration on upgrades; Flyway still validates checksums.
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=validate

# Two-way Google Calendar sync (off by default). See docs/google-calendar-sync.md.
#   APP_CALENDAR_ENABLED=true  APP_CALENDAR_CLIENT_ID  APP_CALENDAR_CLIENT_SECRET  APP_CALENDAR_REFRESH_TOKEN
app.calendar.enabled=false

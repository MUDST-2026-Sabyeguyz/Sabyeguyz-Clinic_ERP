name: Frontend tests and build

on:
  push:
    branches: [main, develop, xan, 'feat/**', 'feature/**']
  pull_request:
    branches: [develop, xan]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit:coverage

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Generate integration credentials
        run: |
          postgres_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          echo "POSTGRES_PASSWORD=$postgres_password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "APP_BOOTSTRAP_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "CYPRESS_BOOTSTRAP_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

      - name: Start backend integration stack
        working-directory: .
        env:
          APP_BOOTSTRAP_ENABLED: "true"
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$JWT_SECRET"
          test -n "$APP_BOOTSTRAP_ADMIN_PASSWORD"
          docker compose up --build -d

      - name: Cypress backend integration
        env:
          CYPRESS_BASE_URL: http://localhost
          CYPRESS_BACKEND_URL: http://localhost:8080
        run: npm run test:integration

      - name: Stop integration stack
        if: always()
        working-directory: .
        run: docker compose down -v

name: Frontend tests and build

on:
  push:
    branches: [main, develop, xan, 'feat/**', 'feature/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Start backend integration stack
        working-directory: .
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$JWT_SECRET"
          docker compose up --build -d

      - name: Cypress backend integration
        env:
          CYPRESS_BASE_URL: http://localhost
          CYPRESS_BACKEND_URL: http://localhost:8080
        run: npm run test:integration

      - name: Stop integration stack
        if: always()
        working-directory: .
        run: docker compose down -v

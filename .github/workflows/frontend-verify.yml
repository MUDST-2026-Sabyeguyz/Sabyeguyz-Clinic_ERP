name: Frontend tests and build

on:
  push:
    branches: [main, develop, xan, 'feat/**', 'feature/**']
  pull_request:
    branches: [develop, xan]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit:coverage

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Generate integration credentials
        run: |
          postgres_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          echo "POSTGRES_PASSWORD=$postgres_password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "APP_BOOTSTRAP_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "CYPRESS_BOOTSTRAP_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

      - name: Start backend integration stack
        working-directory: .
        env:
          APP_BOOTSTRAP_ENABLED: "true"
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$JWT_SECRET"
          test -n "$APP_BOOTSTRAP_ADMIN_PASSWORD"
          docker compose up --build -d

      - name: Wait for integration backend
        working-directory: .
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color backend
          exit 1

      - name: Start Vite for browser integration
        run: |
          mkdir -p cypress/diagnostics
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > cypress/diagnostics/vite.log 2>&1 &
          echo $! > cypress/diagnostics/vite.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173 > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat cypress/diagnostics/vite.pid)" 2>/dev/null; then
              cat cypress/diagnostics/vite.log
              exit 1
            fi
            sleep 1
          done
          cat cypress/diagnostics/vite.log
          exit 1

      - name: Cypress backend integration
        env:
          CYPRESS_BASE_URL: http://localhost:5173
          CYPRESS_BACKEND_URL: http://localhost:8080
        run: npm run test:integration

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-diagnostics
          path: |
            frontend/cypress/diagnostics
            frontend/cypress/screenshots
            frontend/cypress/videos
          if-no-files-found: ignore

      - name: Stop Vite
        if: always()
        run: |
          if [ -f cypress/diagnostics/vite.pid ]; then
            kill "$(cat cypress/diagnostics/vite.pid)" 2>/dev/null || true
          fi

      - name: Stop integration stack
        if: always()
        working-directory: .
        run: docker compose down -v

name: Schema CI

# Builds the v2 database from db/migration_new/V1__initial_schema.sql on a real PostgreSQL and checks
# that every clinicv2 entity matches it (Hibernate validate) and that the whole bean graph wires.

on:
  push:
    branches: [develop, dev-backed, 'feat/**', 'feature/**']
    paths:
      - 'backend/src/main/java/com/sabyeguyz/clinicv2/**'
      - 'backend/src/main/resources/db/migration_new/**'
      - 'backend/src/test/java/com/sabyeguyz/schemacheck/**'
      - 'backend/pom.xml'
      - '.github/workflows/schema-ci.yml'
  pull_request:
    branches: [develop, dev-backed]
    paths:
      - 'backend/src/main/java/com/sabyeguyz/clinicv2/**'
      - 'backend/src/main/resources/db/migration_new/**'
      - 'backend/src/test/java/com/sabyeguyz/schemacheck/**'
      - 'backend/pom.xml'
      - '.github/workflows/schema-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_URL: jdbc:postgresql://localhost:5432/clinic
      DB_USER: clinic
      DB_PASSWORD: clinic
      PGPASSWORD: clinic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Create the v2 schema from the SQL file
        run: psql -h localhost -U clinic -d clinic -v ON_ERROR_STOP=1 -f src/main/resources/db/migration_new/V1__initial_schema.sql

      - name: Compile main and test classes
        run: mvn --batch-mode --no-transfer-progress -DskipTests test-compile

      - name: Resolve the test classpath
        run: >-
          mvn --batch-mode --no-transfer-progress -q dependency:build-classpath
          -Dmdep.outputFile=target/test-classpath.txt -Dmdep.includeScope=test

      - name: Check entities against PostgreSQL
        run: java -cp "target/test-classes:target/classes:$(cat target/test-classpath.txt)" com.sabyeguyz.schemacheck.SchemaCheck

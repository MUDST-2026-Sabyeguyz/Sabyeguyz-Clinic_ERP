name: Frontend E2E (v2 backend)

# Browser tests (Cypress) of the staff web app against the real v2 backend on PostgreSQL 16.
# The backend is started with the cypress-v2 profile, which resets the data before every test, and the Vite dev
# server proxies /api to it. See docs/frontend-e2e-tests.md.

on:
  push:
    branches: [develop, dev-backed, 'feat/**', 'feature/**', 'codex/**']
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/com/sabyeguyz/clinicv2/**'
      - 'backend/src/main/resources/db/migration/**'
      - 'backend/src/main/resources/db/seed_v2/**'
      - 'backend/src/test/java/com/sabyeguyz/clinicv2/cypress/**'
      - '.github/workflows/frontend-e2e-v2.yml'
  pull_request:
    branches: [develop, dev-backed]
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/com/sabyeguyz/clinicv2/**'
      - 'backend/src/main/resources/db/migration/**'
      - 'backend/src/main/resources/db/seed_v2/**'
      - 'backend/src/test/java/com/sabyeguyz/clinicv2/cypress/**'
      - '.github/workflows/frontend-e2e-v2.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/clinic
      DATABASE_USERNAME: clinic
      DATABASE_PASSWORD: clinic

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend
        working-directory: frontend
        run: npm ci

      - name: Start the v2 backend on port 18080
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -Pcypress-v2 test-compile spring-boot:start

      - name: Cypress browser tests
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:18080
          CYPRESS_API_URL: http://127.0.0.1:18080
        with:
          working-directory: frontend
          install: false
          start: npm run dev -- --host localhost --port 5173
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120
          browser: chrome
          config-file: cypress.v2.config.ts

      - name: Stop the backend
        if: always()
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -Pcypress-v2 spring-boot:stop

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-e2e-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

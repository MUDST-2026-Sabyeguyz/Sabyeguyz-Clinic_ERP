name: V2 API tests

# Runs the HTTP-level Cypress suite (backend/cypress/e2e-v2) against the real v2 application
# (ClinicV2Application) on PostgreSQL 16, started by `mvn -Pcypress-v2 spring-boot:start`.

on:
  push:
    branches: [develop, dev-backed, 'feat/**', 'feature/**', 'codex/**', 'codex/**']
    paths:
      - 'backend/src/main/java/com/sabyeguyz/clinicv2/**'
      - 'backend/src/main/resources/db/migration/**'
      - 'backend/src/main/resources/db/seed_v2/**'
      - 'backend/src/main/resources/application*.properties'
      - 'backend/src/test/java/com/sabyeguyz/clinicv2/cypress/**'
      - 'backend/src/test/resources/application-cypress-v2.properties'
      - 'backend/cypress/e2e-v2/**'
      - 'backend/cypress/support-v2/**'
      - 'backend/cypress.v2.config.cjs'
      - 'backend/scripts/run-v2-tests.cjs'
      - 'backend/pom.xml'
      - '.github/workflows/v2-api-ci.yml'
  pull_request:
    branches: [develop, dev-backed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  v2-cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/clinic
      DATABASE_USERNAME: clinic
      DATABASE_PASSWORD: clinic

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Cypress
        run: npm ci

      - name: Run the v2 API tests
        run: npm run test:v2

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-cypress-results
          path: backend/cypress/results
          if-no-files-found: ignore

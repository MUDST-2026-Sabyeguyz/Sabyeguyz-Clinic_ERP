name: Backend tests and package

on:
  push:
    branches: [main, develop, xan, 'feat/**', 'feature/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Generate integration credentials
        run: |
          postgres_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          echo "POSTGRES_PASSWORD=$postgres_password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "APP_BOOTSTRAP_ENABLED=true" >> "$GITHUB_ENV"
          echo "APP_BOOTSTRAP_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

      - name: Start PostgreSQL integration stack
        working-directory: .
        run: docker compose up --build --wait -d postgres backend

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Stop integration stack
        if: always()
        working-directory: .
        run: docker compose down -v

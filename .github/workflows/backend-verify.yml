name: Backend tests and package

on:
  push:
    branches: [main, develop, xan, 'feat/**', 'feature/**']
  pull_request:
    branches: [develop, xan]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_INTEGRATION_REQUIRED: 'true'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: clinic_erp_ci
      POSTGRES_USER: clinic_ci
      POSTGRES_PASSWORD: clinic_ci_ephemeral_test_only
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/clinic_erp_ci
      SPRING_DATASOURCE_USERNAME: clinic_ci
      SPRING_DATASOURCE_PASSWORD: clinic_ci_ephemeral_test_only
      JWT_SECRET: clinic_ci_ephemeral_jwt_test_only
      APP_BOOTSTRAP_ADMIN_PASSWORD: clinic_ci_ephemeral_admin_test_only
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinic_erp_ci
          POSTGRES_USER: clinic_ci
          POSTGRES_PASSWORD: clinic_ci_ephemeral_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_ci -d clinic_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start database-v2 migrations against the isolated PostgreSQL service
        run: |
          mvn --batch-mode --no-transfer-progress spring-boot:run -Dspring-boot.run.profiles=database-v2 > /tmp/clinic-backend-startup.log 2>&1 &
          echo $! > /tmp/clinic-backend-startup.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/clinic-backend-startup.pid)" 2>/dev/null; then
              cat /tmp/clinic-backend-startup.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/clinic-backend-startup.log
          exit 1

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Generate backend coverage report
        if: always()
        run: mvn --batch-mode --no-transfer-progress jacoco:report

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

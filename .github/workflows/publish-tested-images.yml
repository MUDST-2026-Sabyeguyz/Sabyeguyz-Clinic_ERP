name: Publish tested images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA that has passing backend, frontend and Compose CI on xan
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-source:
    name: Verify tested source SHA
    if: github.ref == 'refs/heads/xan'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Require xan ancestry and green CI
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase commit SHA"
            exit 1
          fi
          git fetch origin xan --no-tags
          git merge-base --is-ancestor "$SOURCE_SHA" origin/xan
          runs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")"
          for workflow in "Backend tests and package" "Frontend tests and build" "Compose build"; do
            count="$(jq --arg name "$workflow" --arg sha "$SOURCE_SHA" \
              '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | length' \
              <<< "$runs")"
            if [[ "$count" -lt 1 ]]; then
              echo "::error::No successful push CI run for $workflow at $SOURCE_SHA"
              exit 1
            fi
            echo "Verified green push CI: $workflow ($SOURCE_SHA)"
          done
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, publish and pull by digest
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push backend image
        id: backend
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
          IMAGE: ghcr.io/mudst-2026-sabyeguyz/sabyeguyz-clinic-erp-backend
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --push --provenance=true \
            --metadata-file "$RUNNER_TEMP/backend-metadata.json" \
            --tag "$IMAGE:sha-$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --file backend/Dockerfile backend
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/backend-metadata.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "backend_image=$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          docker pull "$IMAGE@$digest"
          pulled="$(docker image inspect "$IMAGE@$digest" --format '{{ index .RepoDigests 0 }}')"
          [[ "$pulled" == "$IMAGE@$digest" ]]

      - name: Build and push frontend image
        id: frontend
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
          IMAGE: ghcr.io/mudst-2026-sabyeguyz/sabyeguyz-clinic-erp-frontend
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --push --provenance=true \
            --metadata-file "$RUNNER_TEMP/frontend-metadata.json" \
            --tag "$IMAGE:sha-$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --file frontend/Dockerfile frontend
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/frontend-metadata.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          docker pull "$IMAGE@$digest"
          pulled="$(docker image inspect "$IMAGE@$digest" --format '{{ index .RepoDigests 0 }}')"
          [[ "$pulled" == "$IMAGE@$digest" ]]

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io

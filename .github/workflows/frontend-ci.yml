name: Frontend CI

on:
  push:
    branches: [develop, 'feat/**', 'feature/**', 'codex/**', 'codex/**']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Production build
        run: npm run build

      - name: Start backend for browser tests
        working-directory: .
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export POSTGRES_DB=clinic_erp_v2_ci
          echo 'POSTGRES_DB=clinic_erp_v2_ci' >> "$GITHUB_ENV"
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' "$POSTGRES_PASSWORD" "$JWT_SECRET" >> "$GITHUB_ENV"
          docker compose up --build --wait -d postgres backend

      - name: Cypress end-to-end tests
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          working-directory: frontend
          install: false
          start: npm run dev -- --host localhost
          wait-on: 'http://localhost:5173'
          browser: chrome
          command: npm run test:e2e -- --browser chrome

      - name: Show backend logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail=200 postgres backend

      - name: Stop backend test services
        if: always()
        working-directory: .
        run: docker compose down -v

name: Clinic CI/CD

on:
  push:
    branches: [develop, 'feat/**', 'feature/**', 'codex/presentation-devops-20261017']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinic-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml
  frontend:
    uses: ./.github/workflows/frontend-ci.yml
  compose-integration:
    name: PostgreSQL integration and immutable images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.publish.outputs.backend_image }}
      frontend_image: ${{ steps.publish.outputs.frontend_image }}
    env:
      COMPOSE_PROJECT_NAME: clinic-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: 15432
      BACKEND_PORT: 18080
      FRONTEND_PORT: 18081
      SMOKE_USERNAME: manager
      SMOKE_PASSWORD: manager123
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@v3
      - name: Generate isolated runtime credentials
        run: |
          pg_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$pg_password"
          echo "::add-mask::$jwt_secret"
          echo "POSTGRES_PASSWORD=$pg_password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
      - name: Validate, build and start Compose
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 240 -d
      - name: Real HTTP and PostgreSQL persistence
        run: |
          python scripts/ci/api-smoke.py --base-url http://localhost:18081 --output evidence/compose-create.json
          hn=$(python -c "import json; print(json.load(open('evidence/compose-create.json'))['hn'])")
          [[ "$hn" =~ ^[A-Za-z0-9-]+$ ]]
          count=$(docker compose exec -T postgres psql -U clinic -d clinic_erp -Atc "SELECT count(*) FROM patients WHERE hn='$hn'")
          test "$count" = 1
          docker compose exec -T postgres psql -U clinic -d clinic_erp -Atc 'SELECT version,success FROM flyway_schema_history ORDER BY installed_rank' > evidence/flyway-history.txt
          docker compose restart postgres backend
          docker compose up --wait --wait-timeout 240 -d
          python scripts/ci/api-smoke.py --base-url http://localhost:18081 --verify-existing evidence/compose-create.json --output evidence/compose-restart.json
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/codex/presentation-devops-20261017')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify immutable images
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/codex/presentation-devops-20261017')
        run: |
          backend="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          frontend="ghcr.io/${GITHUB_REPOSITORY,,}-frontend"
          docker tag "$COMPOSE_PROJECT_NAME-backend" "$backend:sha-$GITHUB_SHA"
          docker build --build-arg VITE_API_BASE_URL=/sabyeguyz --build-arg VITE_APP_BASE_URL=/sabyeguyz/ --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$frontend:sha-$GITHUB_SHA" frontend
          docker push "$backend:sha-$GITHUB_SHA"
          docker push "$frontend:sha-$GITHUB_SHA"
          docker pull "$backend:sha-$GITHUB_SHA"
          docker pull "$frontend:sha-$GITHUB_SHA"
          b_ref=$(docker image inspect "$backend:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          f_ref=$(docker image inspect "$frontend:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          [[ "$b_ref" == "$backend@sha256:"* ]]
          [[ "$f_ref" == "$frontend@sha256:"* ]]
          docker pull "$b_ref"
          docker pull "$f_ref"
          echo "backend_image=$b_ref" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$f_ref" >> "$GITHUB_OUTPUT"
          printf 'source=%s\nbackend=%s\nfrontend=%s\n' "$GITHUB_SHA" "$b_ref" "$f_ref" > evidence/images.txt
      - name: Upload integration and image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: ignore
      - name: Remove only this run's disposable Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
  deploy-demo:
    name: Deploy via Windows runner to Kubernetes
    needs: compose-integration
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/codex/presentation-devops-20261017')
    runs-on: [self-hosted, Windows, X64, clinic-phase1, powershell7]
    timeout-minutes: 25
    concurrency:
      group: clinic-k8s-presentation-demo
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_IMAGE: ${{ needs.compose-integration.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.compose-integration.outputs.frontend_image }}
      SOURCE_SHA: ${{ github.sha }}
      MINIKUBE_EXE: ${{ vars.CLINIC_MINIKUBE_EXE }}
      SMOKE_USERNAME: manager
      SMOKE_PASSWORD: manager123
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Pull verified images into the local Docker engine
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GHCR_TOKEN | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'GHCR login failed' }
          docker pull $env:BACKEND_IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'Backend digest pull failed' }
          docker pull $env:FRONTEND_IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'Frontend digest pull failed' }
      - name: Deploy isolated namespace and verify Ingress
        run: ./scripts/deploy/deploy-demo.ps1 -BackendImage $env:BACKEND_IMAGE -FrontendImage $env:FRONTEND_IMAGE -SourceSha $env:SOURCE_SHA
      - name: Upload Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-demo-${{ github.sha }}
          path: evidence/k8s/
          if-no-files-found: ignore
      - name: Logout registry
        if: always()
        run: docker logout ghcr.io

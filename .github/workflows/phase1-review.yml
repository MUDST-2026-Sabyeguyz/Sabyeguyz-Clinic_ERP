name: Phase 1 review

on:
  push:
    branches: [main, develop, backup/draft-phase1]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-review-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  code-tests-coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Defaults to GitHub hosted. Owners may select an existing dedicated runner using a JSON array variable.
    runs-on: ${{ fromJSON(vars.PHASE1_REVIEW_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Verify current v2 code, tests and coverage on disposable PostgreSQL
        run: node scripts/verify-phase1.mjs
      - name: Upload source-bound run evidence and coverage (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-review-${{ github.sha }}
          path: |
            artifacts/phase1/
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            frontend/coverage/
            frontend/test-results/
            frontend/cypress/screenshots/
          if-no-files-found: warn
          retention-days: 14

  compose-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.PHASE1_REVIEW_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Build Docker images and verify real seeded Compose runtime
        run: node scripts/verify-compose.mjs
      - name: Upload Compose runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-compose-${{ github.sha }}
          path: artifacts/compose/
          if-no-files-found: warn
          retention-days: 14

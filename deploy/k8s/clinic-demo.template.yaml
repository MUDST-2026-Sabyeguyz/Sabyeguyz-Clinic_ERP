# Render using scripts/deploy/deploy-demo.ps1. Secret values are provisioned separately.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinic-config
data:
  POSTGRES_DB: clinic_erp
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic_erp
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None
  selector:
    app: clinic-demo-postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: clinic-demo-postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clinic-demo-postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: clinic-demo-postgres
  template:
    metadata:
      labels:
        app: clinic-demo-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: clinic-config
            - secretRef:
                name: clinic-runtime
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-demo-backend
  annotations:
    clinic.source-sha: __SOURCE_SHA__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # One Flyway startup runner; image upgrades briefly interrupt this demo API.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clinic-demo-backend
  template:
    metadata:
      labels:
        app: clinic-demo-backend
      annotations:
        clinic.source-sha: __SOURCE_SHA__
    spec:
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: clinic-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clinic-runtime
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinic-runtime
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clinic-runtime
                  key: JWT_SECRET
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: clinic-demo-backend
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-demo-frontend
  annotations:
    clinic.source-sha: __SOURCE_SHA__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: clinic-demo-frontend
  template:
    metadata:
      labels:
        app: clinic-demo-frontend
      annotations:
        clinic.source-sha: __SOURCE_SHA__
    spec:
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: clinic-demo-frontend
  ports:
    - port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: clinic-prefix
spec:
  stripPrefix:
    prefixes: [/sabyeguyz]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinic-demo
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: __NAMESPACE__-clinic-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /sabyeguyz/api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /sabyeguyz
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

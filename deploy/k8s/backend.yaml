apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: clinic-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: clinic-config}
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef: {name: clinic-config, key: POSTGRES_USER}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: clinic-secrets, key: POSTGRES_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: clinic-secrets, key: JWT_SECRET}
            - name: CLINIC_BOOTSTRAP_MANAGER_USERNAME
              valueFrom:
                secretKeyRef: {name: clinic-secrets, key: MANAGER_USERNAME}
            - name: CLINIC_BOOTSTRAP_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef: {name: clinic-secrets, key: MANAGER_PASSWORD}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: '2', memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
            failureThreshold: 3
          # A DB outage should make this pod unready, without restart loops.
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports:
    - {name: http, port: 8080, targetPort: http}

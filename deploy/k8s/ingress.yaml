apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: clinic-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinic
spec:
  ingressClassName: clinic-traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: {number: 8080}
          - path: /actuator/health
            pathType: Exact
            backend:
              service:
                name: backend
                port: {number: 8080}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 80}

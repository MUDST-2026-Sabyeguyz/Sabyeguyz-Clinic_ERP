apiVersion: v1
kind: ServiceAccount
metadata:
  name: clinic-deployer
  namespace: clinic-present
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clinic-deployer
  namespace: clinic-present
rules:
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clinic-deployer
  namespace: clinic-present
subjects:
  - kind: ServiceAccount
    name: clinic-deployer
    namespace: clinic-present
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clinic-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clinic-deployer-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "storageclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clinic-deployer-node-reader
subjects:
  - kind: ServiceAccount
    name: clinic-deployer
    namespace: clinic-present
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clinic-deployer-node-reader
---
apiVersion: v1
kind: Secret
metadata:
  name: clinic-deployer-token
  namespace: clinic-present
  annotations:
    kubernetes.io/service-account.name: clinic-deployer
type: kubernetes.io/service-account-token

apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: 'docker,v2'}
            - {name: CLINIC_DATABASE_KIND, value: '__DATABASE_KIND__'}
            - {name: CLINIC_SEED_MODE, value: '__SEED_MODE__'}
            - {name: SERVER_FORWARD_HEADERS_STRATEGY, value: framework}
            - {name: SPRING_DATASOURCE_URL, value: 'jdbc:postgresql://postgres:5432/__DATABASE_NAME__'}
            - {name: SPRING_DATASOURCE_USERNAME, value: clinic}
            - {name: SPRING_FLYWAY_ENABLED, value: 'true'}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: clinic-secrets, key: SPRING_DATASOURCE_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: clinic-secrets, key: JWT_SECRET}
          ports: [{containerPort: 8080}]
          startupProbe:
            httpGet: {path: /actuator/health, port: 8080}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 5

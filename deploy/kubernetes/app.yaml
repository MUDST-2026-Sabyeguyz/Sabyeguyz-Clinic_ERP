apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: clinic_demo}
            - {name: POSTGRES_USER, value: clinic}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: clinic-secrets, key: POSTGRES_PASSWORD}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data, subPath: postgres}
          readinessProbe:
            exec:
              command: [pg_isready, -U, clinic, -d, clinic_demo]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: 'docker,v2'}
            - {name: SPRING_DATASOURCE_URL, value: 'jdbc:postgresql://postgres:5432/clinic_demo'}
            - {name: SPRING_DATASOURCE_USERNAME, value: clinic}
            - {name: APP_V2_FLYWAY_EXTRA_LOCATIONS, value: ',classpath:db/seed_v2'}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: clinic-secrets, key: SPRING_DATASOURCE_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: clinic-secrets, key: JWT_SECRET}
          ports: [{containerPort: 8080}]
          startupProbe:
            httpGet: {path: /actuator/health, port: 8080}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 5
